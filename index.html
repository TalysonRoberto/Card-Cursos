<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Cursos</title>
    <link rel="stylesheet" href="styles.css"/>
    <link rel="icon" href="Cursos.png" >
</head>
<body>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <div class="menu">
       <div class="container verde">
          <div class="data">
            <span>JAN 3, 2025</span><span><i class="fas fa-ellipsis-v"></i></span>
          </div>
          <div class="name">
            <h2> Java Script </h2>
            <span>Linguagem</span>
          </div>
          <div class="progress">
            <span>Progresso</span>
            <div class="prog_total"> <div class="prog verde"> </div> </div>
          </div>
          <hr>
          <div class="implemento">
            <div id="menos_js" class="menos"> <i class="fa-solid fa-minus"></i> <!-- Ícone de "-" --> </div> 
            <div id="mais_js" class="mais"> <i class="fa-solid fa-plus"></i>  <!-- Ícone de "+" --> </div> 
          </div>
      </div> 
      
      <div class="container amarelo">
          <div class="data">
            <span>FEV 8, 2025</span><span><i class="fas fa-ellipsis-v"></i></span>
          </div>
          <div class="name">
            <h2> React </h2>
            <span>Biblioteca</span>
          </div>
          <div class="progress">
            <span>Progresso</span>
            <div class="prog_total"> <div class="prog amarelo"> </div> </div>
          </div>
          <hr>
          <div class="implemento">
            <div id="menos_react" class="menos"> <i class="fa-solid fa-minus"></i> <!-- Ícone de "-" --> </div> 
            <div id="mais_react" class="mais" > <i class="fa-solid fa-plus"></i>  <!-- Ícone de "+" --> </div> 
          </div>
      </div> 
      
      <div class="container vermelho">
          <div class="data">
            <span>MAR 23, 2025</span><span><i class="fas fa-ellipsis-v"></i></span>
          </div>
          <div class="name">
             <h2> React Native </h2>
            <span>Framework</span>
          </div>
          <div class="progress">
            <span>Progresso</span>
            <div class="prog_total"> <div class="prog vermelho"> </div> </div>
          </div>
          <hr>
          <div class="implemento">
            <div id="menos_react_native" class="menos"> <i class="fa-solid fa-minus"></i> <!-- Ícone de "-" --> </div> 
            <div id="mais_react_native" class="mais" > <i class="fa-solid fa-plus"></i>  <!-- Ícone de "+" --> </div> 
          </div>
      </div> 
      
      <div class="container azul">
          <div class="data">
            <span>ABR 5, 2025</span><span><i class="fas fa-ellipsis-v"></i></span>
          </div>
          <div class="name">
             <h2> Flutter </h2>
            <span>Framework</span>
          </div>
          <div class="progress">
            <span>Progresso</span>
            <div class="prog_total"> <div class="prog azul"> </div> </div>
          </div>
          <hr>
          <div class="implemento">
            <div id="menos_flutter" class="menos"> <i class="fa-solid fa-minus"></i> <!-- Ícone de "-" --> </div> 
            <div id="mais_flutter" class="mais" > <i class="fa-solid fa-plus"></i>  <!-- Ícone de "+" --> </div> 
          </div>
      </div> 
    </div>
    
    <script src="script.js" type="text/javascript"></script>
</body>
</html>
